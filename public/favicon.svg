<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="100%" height="100%">
  <g transform="translate(42, 25)">
    <!-- The Loop of the Thread / Left leg of A -->
    <path d="M 50,180 C 10,130 10,70 50,50 C 90,30 110,90 100,120"
          fill="none" stroke="#C9A96E" stroke-width="6" stroke-linecap="round"/>

    <!-- The Needle -->
    <path d="M 160,200 L 100,20" fill="none" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round"/>

    <!-- Needle Eye -->
    <ellipse cx="109" cy="47" rx="2" ry="6" transform="rotate(-20, 109, 47)" fill="#FAF7F2"/>

    <!-- Thread going through the eye -->
    <path d="M 100,120 C 95,100 100,60 109,47 C 115,35 130,20 150,40"
          fill="none" stroke="#C9A96E" stroke-width="4" stroke-dasharray="3,3"/>

    <!-- Horizontal Crossbar of the "A" -->
    <line x1="58" y1="120" x2="128" y2="120" stroke="#C9A96E" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
